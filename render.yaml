services:
  - type: web
    name: refconnect
    runtime: node
    plan: free
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --prod=false && pnpm db:migrate:verbose && pnpm build
    startCommand: NODE_ENV=production node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DATABASE_URL
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
